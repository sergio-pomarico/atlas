name: Backend Tests

on: pull_request

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_test
        run: pnpm --filter @atlas/api db:generate

      - name: Check backend types
        run: pnpm --filter @atlas/api type-check

      - name: Run backend tests
        run: pnpm --filter @atlas/api test

      - name: Upload API coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  fallow:
    needs: backend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download API coverage
        uses: actions/download-artifact@v5
        with:
          name: api-coverage
          path: apps/api/coverage

      - name: Verify API coverage
        run: test -f apps/api/coverage/coverage-final.json

      - uses: fallow-rs/fallow@v3
        with:
          command: audit
          gate: new-only
          format: sarif
          coverage: apps/api/coverage/coverage-final.json
